version: "3.8"

services:
  # --- SERVICIO 1: Base de Datos PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    container_name: fnet_services_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-fnet_services_db}
    ports:
      - "5432:5432"
    volumes:
      - fnet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fnet_services_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- SERVICIO 2: Redis (Streams + Cache) ---
  redis:
    image: redis:7-alpine
    container_name: fnet_services_redis
    restart: always
    command: redis-server --appendonly yes  # Persistencia AOF para eventos en Redis Streams
    ports:
      - "6379:6379"
    volumes:
      - fnet_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- SERVICIO 3: Aplicación FastAPI ---
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fnet_services_api
    restart: always
    ports:
      - "8000:8000"
    #dns:
    #  - 8.8.8.8
    #  - 1.1.1.1
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-fnet_services_db}"
      REDIS_URL: "redis://redis:6379/0"
    volumes:
      - ./app:/app/app  # Recarga en vivo al modificar código local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  fnet_postgres_data:
  fnet_redis_data: